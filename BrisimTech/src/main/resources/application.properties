# Application name
spring.application.name=brisim

# Server port configuration
server.port=8200

# -------------------------------
# MySQL Datasource Configuration
# -------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/brisimtech?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Nairobi
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=BrisimTechHikariCP
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------
# Swagger / OpenAPI Configuration
# -------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# -------------------------------
# Context path
# -------------------------------
server.servlet.context-path=/brisimtech

# -------------------------------
# Mail Configuration
# -------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

